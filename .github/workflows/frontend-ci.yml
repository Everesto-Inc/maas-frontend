name: Frontend CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE: ghcr.io/jacer7/maas-frontend
  TAG: ${{ github.sha }}

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Jest
        run: npm test -- --coverage --ci
        continue-on-error: true   # TODO: add tests

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          severity: CRITICAL,HIGH
        continue-on-error: true   # TODO: resolve flagged vulnerabilities

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Snyk test
        run: npx snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonar.everesto.live
        continue-on-error: true   # requires SONAR_TOKEN secret

  build-push:
    name: Build & Push (multi-arch)
    runs-on: ubuntu-latest
    needs: [security, sonarqube]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU for ARM64 cross-compilation (Oracle Ampere A1 nodes)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE }}:${{ env.TAG }},${{ env.IMAGE }}:latest
          # Bake production URLs into the Next.js bundle
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.everesto.live
            NEXT_PUBLIC_GRAFANA_URL=https://grafana.everesto.live
            NEXT_PUBLIC_APP_NAME=Oracle MaaS
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to dev (main only)
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Jacer7/maas-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update dev image tag in gitops repo
        run: |
          cd gitops
          sed -i "s|newTag:.*|newTag: ${{ env.TAG }}|" environments/dev/frontend/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add environments/dev/frontend/kustomization.yaml
          git commit -m "deploy(dev): maas-frontend → ${{ env.TAG }}"
          git push
