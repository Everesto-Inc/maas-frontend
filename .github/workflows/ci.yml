# CI for maas-frontend — managed by Backstage (Edit pipeline flips the switches below), built on Loop.
# Every run ends with a scanned linux/arm64 image: ghcr.io/everesto-inc/maas-frontend (pushed from main only).
# Gitleaks, Trivy scans and the image build always run. Add own jobs below with `needs: loop`.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'mkdocs.yml', 'catalog-info.yaml', '*.md']   # docs/settings only → no rebuild
  pull_request:
  workflow_dispatch:

concurrency:
  # pull requests: a newer push cancels the older run · main: every commit finishes (each one publishes an image)
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  loop:
    uses: Everesto-Inc/loop/.github/workflows/pipeline.yml@4d70c4efcdad7bd522d60fe13d6c324a83fe0936 # v1.1.2
    with:
      stack: docker
      runner: ubuntu-24.04-arm
      tests: true
      semgrep: true
      sonarqube: true
      trivy: report
      # Next.js bakes NEXT_PUBLIC_* into the JS bundle at build time (same values as the old frontend CI)
      build-args: |
        NEXT_PUBLIC_API_URL=https://api.everesto.live
        NEXT_PUBLIC_GRAFANA_URL=https://grafana.everesto.live
        NEXT_PUBLIC_APP_NAME=Oracle MaaS
      sonar-args: -Dsonar.qualitygate.wait=false   # SonarQube reports but does not block — no tests yet (coverage gate)
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # only what Loop needs — never `inherit` (least privilege)
    permissions:
      contents: read
      packages: write        # push + keep the last 5 images in ghcr.io
